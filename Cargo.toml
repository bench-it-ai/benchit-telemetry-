[workspace]
resolver = "2"
members = ["crates/benchit-telemetry-core", "crates/benchit-telemetry", "crates/benchit-telemetry-panel"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bench-it-ai/benchit-telemetry-"
authors = ["BenchIt contributors"]
keywords = ["telemetry", "benchmark", "gpu", "monitoring", "nvidia"]
categories = ["command-line-utilities", "development-tools::profiling"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "default_fonts", "clipboard"] }
x11rb = "0.14"
png = "0.18"
toml = { version = "1", features = ["display", "parse"] }
printpdf = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
