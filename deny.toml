# cargo-deny policy: advisories, licences and sources. Run `cargo deny check`.
[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0", "OFL-1.1", "LicenseRef-UFL-1.0",
  "Ubuntu-font-1.0", "NCSA", "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
