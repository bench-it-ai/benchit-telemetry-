[package]
name = "benchit-telemetry-core"
description = "Linux workstation telemetry (CPU, memory, disk, network, temperatures, power, NVIDIA GPUs) with a 30-day SQLite history store"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
libc.workspace = true
toml.workspace = true
nvml-wrapper = { version = "0.13", optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["nvml"]
# Query NVIDIA GPUs through NVML (libnvidia-ml.so.1 is loaded at run time; nvidia-smi is the fallback).
nvml = ["dep:nvml-wrapper"]
